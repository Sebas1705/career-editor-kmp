name: Release

# One tag produces every installer: Windows, macOS, Linux and Android, attached to a
# single release. The repository is private, so those downloads are private too — which
# is why this needs no separate distribution service.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: The tag to build and publish.
        required: true
        type: string

permissions:
  contents: write

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            format: msi
          - os: macos-latest
            format: dmg
          - os: ubuntu-latest
            format: deb
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      # The executable bit is set in the repository, but a checkout that loses it
      # fails with a bare "Permission denied" that says nothing about the cause.
      - name: Build installer
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew :composeApp:packageDistributionForCurrentOS --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: folio-${{ matrix.format }}
          path: composeApp/build/compose/binaries/main/${{ matrix.format }}/*
          if-no-files-found: error

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4

      # The keystore is held as a base64 secret and written to a path outside the
      # workspace, so it cannot end up in an artifact by accident.
      - name: Restore keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is not set. See README, 'Publishing a release'."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/folio.jks"

      - name: Build signed APK
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/folio.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew :composeApp:assembleRelease --no-daemon

      - name: Name the APK after the tag
        run: |
          tag="${{ inputs.tag || github.ref_name }}"
          mkdir -p out
          cp composeApp/build/outputs/apk/release/*.apk "out/Folio-${tag}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: folio-apk
          path: out/*.apk
          if-no-files-found: error

  publish:
    needs: [desktop, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ inputs.tag || github.ref_name }}"
          ls -la dist
          gh release create "$tag" dist/* \
            --title "Folio $tag" \
            --generate-notes
